# Contexto http: instalar en /etc/nginx/conf.d/.
# Un aula puede compartir una sola IP: permite 300 sondeos por segundo.
limit_req_zone $binary_remote_addr zone=agua_api:10m rate=500r/s;
# Creacion publica limitada por sitio, no por identidad.
limit_req_zone $server_name zone=agua_creation:1m rate=6r/m;
