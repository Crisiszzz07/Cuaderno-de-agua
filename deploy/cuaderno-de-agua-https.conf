# Instalar solo cuando existan estos certificados.
server {
    listen 80;
    server_name example.org;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cuaderno-de-agua/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://example.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:agua_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=86400" always;
    include /etc/nginx/snippets/cuaderno-de-agua-proxy.conf;
}
