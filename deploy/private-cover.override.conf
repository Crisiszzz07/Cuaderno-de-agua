# Opcional: /etc/systemd/system/cuaderno-de-agua.service.d/private-cover.conf
# Sustituir example.org; crear el secreto de Podman antes de activar.
# El puerto de este ejemplo debe adaptarse al del despliegue existente.
[Service]
ExecStart=
ExecStart=/usr/bin/podman run --rm --name cuaderno-de-agua --pull=never --publish 127.0.0.1:8082:8080 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop=all --security-opt=no-new-privileges --pids-limit=128 --memory=512m --memory-swap=512m --cpus=1 --env PUBLIC_ORIGIN=https://example.org --env PRIVATE_COVER_FILE=/app/runtime-secrets/private-cover.json --secret cuaderno-private-cover,type=mount,target=/app/runtime-secrets/private-cover.json,uid=1000,gid=1000,mode=0400 localhost/ecosistemas-foticos:latest
