# Contexto server: instalar en /etc/nginx/snippets/.
access_log off;
# Los errores del proxy pueden incluir rutas de sesiones; evita su registro.
error_log /dev/null;
server_tokens off;
client_max_body_size 4k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
limit_req_status 429;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-For "";
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
proxy_cache off;
proxy_hide_header X-Powered-By;

location ^~ /.well-known/acme-challenge/ {
    root /var/lib/cuaderno-de-agua/acme;
    default_type text/plain;
    try_files $uri =404;
}

location = /api/live/sessions {
    limit_req zone=agua_creation burst=2 nodelay;
    proxy_pass http://127.0.0.1:8082;
}

location = /api/private-cover {
    limit_req zone=agua_creation burst=2 nodelay;
    proxy_pass http://127.0.0.1:8082;
}

location /api/live/ {
    limit_req zone=agua_api burst=1000 nodelay;
    proxy_pass http://127.0.0.1:8082;
}

location / {
    proxy_pass http://127.0.0.1:8082;
}
